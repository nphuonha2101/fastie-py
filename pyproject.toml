[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastie-py"
version = "0.0.1a1"
authors = [
  { name="Phuong Nha Nguyen", email="phuongnhanguyen.dev@gmail.com" },
]
description = "Fastie Framework - A Laravel Artisan-like CLI and DI-based framework for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "sqlalchemy",
    "pymysql",
    "alembic",
    "pyjwt",
    "redis>=5,<6",
    "bcrypt>=4,<5",
    "email-validator",
    "mako",
    "click",
    "rich",
    "dynaconf",
]

[project.urls]
"Homepage" = "https://github.com/nphuonha2101/fastie-py"
"Bug Tracker" = "https://github.com/nphuonha2101/fastie-py/issues"

[project.scripts]
fastie = "fastie.cli:cli"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["fastie*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
fastie = ["templates/**/*.mako", "stubs/**/*"]

[tool.setuptools.exclude-package-data]
fastie = ["**/__pycache__/*", "**/*.py[cod]"]
